[package]
name = "nimbus-split-win"
version = "0.2.0"
description = "Windows exclude-mode split tunneling for Nimbus, on Mullvad's signed GPL driver"
authors = ["Nimbus contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nimbus_split_win"
path = "src/lib.rs"

[[bin]]
name = "nimbus-split-win"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

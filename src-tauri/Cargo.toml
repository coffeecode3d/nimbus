[package]
name = "app"
version = "0.1.1"
description = "Unofficial Wayland-friendly AirVPN desktop client driving the official Eddie engine"
authors = ["Nimbus contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/coffeecode3d/nimbus"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

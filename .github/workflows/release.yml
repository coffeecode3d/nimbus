name: Release signed bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - label: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish signed bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nimbus ${{ github.ref_name }}"
          releaseBody: |
            Nimbus 0.2.0 adds per-application split tunneling, as a first-class
            **Apps** page in the sidebar (Ctrl+3).

            The same list means opposite things per platform, and the page says
            which one it is doing:

            - **Linux — include mode.** Choose the apps that use the VPN;
              everything else keeps your normal connection. A root systemd helper
              puts the selected apps in a cgroup, marks their packets and installs
              a policy route; Eddie runs with `network.ipv4.mode=out`.
            - **Windows — exclude mode.** Choose the apps that bypass the VPN;
              everything else stays inside it. Per-app routing needs a WFP driver
              and Windows only loads drivers signed by Microsoft, so Nimbus drives
              Mullvad's signed GPL-3.0 driver from a LocalSystem service instead of
              shipping one of its own. Eddie stays in its normal `in` mode.

            Nimbus itself never runs privileged code on either platform: it can
            only send a list of applications, and the privileged side decides what
            that list may touch.

            Signed Nimbus desktop builds. Linux self-updates use the AppImage;
            Debian/Ubuntu users should install the new `.deb` with apt or their
            package manager. Windows uses the NSIS installer.

            The updater manifest (`latest.json`) is published with this release.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json

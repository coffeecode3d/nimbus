# Ship executables that do not need the Visual C++ redistributable.
#
# Rust's windows-msvc targets link the CRT dynamically by default, so the binary
# fails at process start with STATUS_DLL_NOT_FOUND (0xC0000135) on a machine
# without VCRUNTIME140.dll — which is every fresh Windows install, including the
# test VM. The installer's hook hit exactly that: `--install` returned
# -1073741515 and silently registered nothing.
#
# Static linking applies to every crate built for this target in the workspace,
# Nimbus itself included, which also removes the redistributable from the app's
# own requirements.
#
# This lives at the repository root, not in src-tauri: cargo reads configuration
# by walking up from the *working directory*, and the service is built from the
# root (`cargo build --manifest-path src-tauri/Cargo.toml`), so a config inside
# src-tauri never applied to it. Verified by checking the produced binary for a
# VCRUNTIME140.dll import.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
